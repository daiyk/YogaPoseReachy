[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_pose_coach"
version = "1.2.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [ "certifi>=2026.10.19", "pip>=26.2.2", "huggingface-hub>=1.17.0", "httpx>=0.28.1", "python-dotenv", "platformdirs", "openai==2.28.0", "reachy_mini_dances_library", "reachy-mini>=1.11.0", "mcp>=2.0,<3", "mcp-types>=2.0,<3", "httpx2>=2.5.0", "numpy>=2.2.5", "opencv-contrib-python==5.0.0.93", "pillow>=10", "mediapipe==1.1.1; sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64')",]
[[project.authors]]
name = "Pollen Robotics"
email = "contact@pollen-robotics.com"

[dependency-groups]
dev = [ "pytest", "pytest-asyncio", "pytest-cov==7.1.0", "ruff==0.15.20", "mypy==2.2.0", "pre-commit",]

[project.scripts]
reachy-mini-pose-coach = "reachy_mini_pose_coach.main:main"

[tool.uv]
required-version = ">=0.13.4"
exclude-newer = "7 days"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 119
exclude = [ ".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache",]

[tool.mypy]
python_version = "3.12"
files = [ "src/",]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true

[project.entry-points.reachy_mini_apps]
reachy_mini_pose_coach = "reachy_mini_pose_coach.main:ReachyMiniPoseCoach"

[tool.uv.exclude-newer-package]
certifi = false
pip = false
reachy-mini = false
reachy-mini-dances-library = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
reachy_talk_data = [ "profiles/**/*.md",]
reachy_mini_pose_coach = [ "static/**/*", ".env.example", "pose/assets/*", "pose/runtime/*.txt",]

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "C4", "D",]
ignore = [ "E501", "D100", "D203", "D213",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
where = [ "src",]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = [ "standard-library", "local-folder",]
known-local-folder = [ "reachy_mini_pose_coach",]
known-first-party = [ "reachy_mini", "reachy_mini_dances_library",]
split-on-trailing-comma = true
